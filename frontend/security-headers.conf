# Security headers of the app's pages and assets, included by nginx.conf in every location
# that sets headers of its own (nginx does not inherit add_header into such locations). The
# API sets its own headers (Django).
#   Referrer-Policy: other sites only learn this site's address, never a page's path (e.g. a
#                    shared link /share/<token>).
#   Permissions-Policy: the app needs no camera, microphone, location, payment or USB.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
