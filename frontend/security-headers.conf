# Security headers of the app's pages and assets, included by nginx.conf in every location
# that sets headers of its own (nginx does not inherit add_header into such locations). The
# API sets its own headers (Django).
#   Referrer-Policy: other sites only learn this site's address, never a page's path (e.g. a
#                    shared link /share/<token>).
#   Permissions-Policy: the app needs no camera, microphone, location or USB. The browser's
#                    payment sheet (Apple Pay, Google Pay) is only for Paddle's checkout, which
#                    a server with paid plans shows in a frame (docs/billing.md); the app
#                    itself never asks for a payment.
# There is no Content-Security-Policy for scripts or frames here. Who adds one has to allow,
# on a server with paid plans, the script https://cdn.paddle.com and the frames of
# https://buy.paddle.com and https://sandbox-buy.paddle.com.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Permissions-Policy 'camera=(), microphone=(), geolocation=(), payment=("https://buy.paddle.com" "https://sandbox-buy.paddle.com"), usb=()' always;
