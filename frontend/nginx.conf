# Behind another proxy that terminates HTTPS (e.g. Caddy, deploy/server/), pass on the scheme
# it reports, so that Django knows the request was encrypted.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# The access log keeps IP addresses shortened (IPv4: the last part is 0, IPv6: the first two
# groups), the path without its query string and no referrer: enough to see what happens,
# little personal data (docs/privacy.md). Behind Caddy the client is the first address in
# X-Forwarded-For.
map $remote_addr $remote_addr_short {
    ~^(?P<net>\d+\.\d+\.\d+)\.\d+$        $net.0;
    ~^(?P<net>[0-9a-fA-F]*:[0-9a-fA-F]*):  $net::;
    default                               -;
}
map $http_x_forwarded_for $forwarded_for_short {
    ~^(?P<net>\d+\.\d+\.\d+)\.\d+(,|$)     $net.0;
    ~^(?P<net>[0-9a-fA-F]*:[0-9a-fA-F]*):  $net::;
    default                               -;
}
map $request_uri $request_path {
    ~^(?P<path>[^?]*)  $path;
}
log_format privacy '$remote_addr_short $forwarded_for_short [$time_local] '
                   '"$request_method $request_path $server_protocol" $status $body_bytes_sent '
                   '$request_time "$http_user_agent"';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 2m;
    access_log /var/log/nginx/access.log privacy;
    # Redirects say only the path (Location: /app?…), so that behind Caddy they keep https.
    absolute_redirect off;

    # Dataset uploads for training (CSV, ZIP with images) can be large. The real limit is
    # BRICKDNN_MAX_UPLOAD_MB, enforced by Django; this only has to be higher.
    location ^~ /api/training/datasets/ {
        client_max_body_size 2g;
        proxy_request_buffering off;
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # CSV imports of the Data tab can be large too. The real limit is
    # BRICKDNN_DATA_MAX_UPLOAD_MB, enforced by Django.
    location ^~ /api/data/sources/ {
        client_max_body_size 2g;
        proxy_request_buffering off;
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Uploads with a signed link (MCP tool create_upload_link, curl -T): data sources and
    # training datasets, limited by Django like the two locations above. The signature is in
    # the query string, which the access log leaves out.
    location ^~ /api/uploads/ {
        client_max_body_size 2g;
        proxy_request_buffering off;
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # MCP: assistants can upload small CSV datasets as text (BRICKDNN_MCP_UPLOAD_MB, 5 MB by
    # default; Django enforces the real limit).
    location ^~ /api/mcp {
        client_max_body_size 12m;
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Live editing: WebSockets go to the realtime container. Its address is looked up again
    # (Docker's DNS, at most 10 seconds old), so that reconnects reach it after it restarted
    # on its own with a new address, instead of failing until nginx restarts too.
    location ^~ /api/ws/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $realtime http://realtime:8001;
        proxy_pass $realtime;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Connections stay open while people edit. Clients ping every 25 seconds and Daphne
        # pings quiet ones, so these only end connections that are dead anyway.
        proxy_connect_timeout 5s;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # API, Django admin and its static files are served by the backend container, and so is
    # the OAuth metadata that MCP clients look up before signing in.
    location ~ ^/((api|admin|static)/|\.well-known/oauth-) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # The landing pages (frontend/landing/): static HTML without the app, English at / and
    # German at /de/. Their one inline script is allowed by its hash; landing.test.ts checks
    # that the hash here is the script's (site.ts). Old links into the editor (/?…) go on to
    # /app with their query; the browser keeps a #… part across the redirect itself.
    # connect-src 'self' only lets tools such as Lighthouse read robots.txt from the page.
    location = / {
        if ($args) {
            return 302 /app?$args;
        }
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'none'; script-src 'sha256-2La7KUV/O4FWITSVlAeqhiA2oAS1wI4wL0UHtB6hFtw='; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
        include /etc/nginx/security-headers.conf;
        try_files /index.html =404;
    }
    location = /de/ {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'none'; script-src 'sha256-2La7KUV/O4FWITSVlAeqhiA2oAS1wI4wL0UHtB6hFtw='; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
        include /etc/nginx/security-headers.conf;
        try_files /de/index.html =404;
    }
    location = /de {
        return 301 /de/;
    }
    location ~ ^/(de/)?index\.html$ {
        return 301 /$1;
    }

    # For crawlers and AI assistants, made with the landing pages.
    location ~ ^/(robots\.txt|sitemap\.xml|llms\.txt)$ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # Everything else is the single-page app (app.html; the editor is at /app).
    location / {
        add_header Cache-Control "no-cache";
        # No other site may show the app in a frame (e.g. to trick users into allowing an app
        # on the OAuth consent page).
        add_header Content-Security-Policy "frame-ancestors 'none'";
        include /etc/nginx/security-headers.conf;
        try_files $uri /app.html;
    }

    gzip on;
    gzip_types text/css text/plain text/xml application/javascript application/json image/svg+xml;
}
