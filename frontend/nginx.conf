server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 2m;

    # Dataset uploads for training (CSV, ZIP with images) can be large. The real limit is
    # BRICKDNN_MAX_UPLOAD_MB, enforced by Django; this only has to be higher.
    location ^~ /api/training/datasets/ {
        client_max_body_size 2g;
        proxy_request_buffering off;
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # API, Django admin and its static files are served by the backend container.
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else is the single-page app.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
