# Behind another proxy that terminates HTTPS (e.g. Caddy, deploy/server/), pass on the scheme
# it reports, so that Django knows the request was encrypted.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 2m;

    # Dataset uploads for training (CSV, ZIP with images) can be large. The real limit is
    # BRICKDNN_MAX_UPLOAD_MB, enforced by Django; this only has to be higher.
    location ^~ /api/training/datasets/ {
        client_max_body_size 2g;
        proxy_request_buffering off;
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Live editing: WebSockets go to the realtime container.
    location ^~ /api/ws/ {
        proxy_pass http://realtime:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Connections stay open while people edit; clients ping every 30 seconds.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # API, Django admin and its static files are served by the backend container, and so is
    # the OAuth metadata that MCP clients look up before signing in.
    location ~ ^/((api|admin|static)/|\.well-known/oauth-) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else is the single-page app.
    location / {
        add_header Cache-Control "no-cache";
        # No other site may show the app in a frame (e.g. to trick users into allowing an app
        # on the OAuth consent page).
        add_header Content-Security-Policy "frame-ancestors 'none'";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
