<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover: the page fills the screen behind the iPhone notch and home
         indicator, global.css keeps content out of those areas. resizes-content: the
         on-screen keyboard shrinks the page (Chrome), so focused fields stay visible. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <script>
      // iOS zooms the page in by itself (when a field gets focus, on a double tap) and stays
      // zoomed. maximum-scale=1 stops these automatic zooms; pinching still zooms, because
      // iOS ignores the limit for the user's own gestures. Only on iOS: elsewhere it would
      // block pinch-zoom. (iPads with iPadOS report themselves as a Mac with touch.)
      if (
        /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)
      ) {
        document.querySelector('meta[name="viewport"]').content += ', maximum-scale=1';
      }
    </script>
    <!-- Title, description and link preview (Open Graph, Twitter card). For a shared link
         (/share/…, /compare/…) nginx puts the tags of that link here instead, which the
         backend makes (frontend/nginx.conf, backend/brick_dnn_core/link_previews.py): the
         three comments below that start with a hash sign are its server-side includes.
         Everywhere else they are plain comments, and the block between them is what the page
         has: every other page of the app, and a shared link whose tags the server cannot give.
         The address of the site in the image links is filled in by landing/plugin.ts. -->
    <!--# block name="preview" -->
    <title>Brick DNN · See every shape. Keep the code.</title>
    <meta
      name="description"
      content="The deep-learning lab for courses: build neural networks from bricks, see every tensor shape and keep the readable PyTorch code."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Brick DNN" />
    <meta property="og:title" content="Brick DNN · See every shape. Keep the code." />
    <meta
      property="og:description"
      content="The deep-learning lab for courses: build neural networks from bricks, see every tensor shape and keep the readable PyTorch code."
    />
    <meta property="og:image" content="%SITE_URL%/brand/link-preview.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Brick DNN: See every shape. Keep the code. Next to it a small convolutional network as bricks." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%SITE_URL%/brand/link-preview.png" />
    <meta name="twitter:image:alt" content="Brick DNN: See every shape. Keep the code. Next to it a small convolutional network as bricks." />
    <!--# endblock -->
    <!--# include virtual="/api/link-preview/$preview_kind/$preview_token/" stub="preview" -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
