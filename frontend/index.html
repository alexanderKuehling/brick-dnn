<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover: the page fills the screen behind the iPhone notch and home
         indicator, global.css keeps content out of those areas. resizes-content: the
         on-screen keyboard shrinks the page (Chrome), so focused fields stay visible. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <script>
      // iOS zooms the page in by itself (when a field gets focus, on a double tap) and stays
      // zoomed. maximum-scale=1 stops these automatic zooms; pinching still zooms, because
      // iOS ignores the limit for the user's own gestures. Only on iOS: elsewhere it would
      // block pinch-zoom. (iPads with iPadOS report themselves as a Mac with touch.)
      if (
        /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)
      ) {
        document.querySelector('meta[name="viewport"]').content += ', maximum-scale=1';
      }
    </script>
    <meta
      name="description"
      content="Build neural networks with drag and drop and export clean, runnable PyTorch code."
    />
    <title>Brick DNN · visual PyTorch model builder</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
