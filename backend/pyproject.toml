[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# Only the framework-independent code generator is packaged:
#   pip install ./backend              ->   `brickdnn` library + command line tool
#   pip install "./backend[train]"     ->   plus PyTorch (and scikit-learn) for `brickdnn train`
#   pip install "./backend[classic]"   ->   plus scikit-learn for classical models only
[project]
name = "brickdnn"
version = "1.1.0"
description = "Build neural networks and classical models from bricks and export clean, runnable PyTorch and scikit-learn code."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Alexander Kühling" }]
keywords = ["pytorch", "neural-network", "code-generation", "deep-learning", "visual-programming", "scikit-learn", "gaussian-process"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Code Generators",
]

[project.optional-dependencies]
# `pip install "brickdnn[train]"` enables `brickdnn train` (local training with PyTorch, and
# of classical models with scikit-learn).
train = ["torch>=2.1", "torchvision>=0.16", "scikit-learn>=1.3"]
# `pip install "brickdnn[classic]"` trains classical models (Gaussian processes, SVMs) only.
classic = ["scikit-learn>=1.3"]
# `pip install "brickdnn[data]"` enables data preparation (brickdnn.data).
data = ["numpy>=1.24", "pandas>=2.2,<3"]

[project.urls]
Homepage = "https://github.com/alexanderKuehling/brick-dnn"
Issues = "https://github.com/alexanderKuehling/brick-dnn/issues"

[project.scripts]
brickdnn = "brickdnn.__main__:main"

[tool.setuptools]
packages = ["brickdnn", "brickdnn.examples", "brickdnn.training", "brickdnn.data", "brickdnn.data.steps"]

[tool.setuptools.package-data]
"brickdnn.examples" = ["*.json"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "brick_dnn_site.settings"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]
