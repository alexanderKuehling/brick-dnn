[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# Only the framework-independent code generator is packaged:
#   pip install ./backend   ->   `brickdnn` library + command line tool
[project]
name = "brickdnn"
version = "1.0.0"
description = "Build neural networks from bricks and export clean, runnable PyTorch code."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Alexander Kühling" }]
keywords = ["pytorch", "neural-network", "code-generation", "deep-learning", "visual-programming"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Code Generators",
]

[project.urls]
Homepage = "https://github.com/alexanderKuehling/brick-dnn"
Issues = "https://github.com/alexanderKuehling/brick-dnn/issues"

[project.scripts]
brickdnn = "brickdnn.__main__:main"

[tool.setuptools]
packages = ["brickdnn", "brickdnn.examples"]

[tool.setuptools.package-data]
"brickdnn.examples" = ["*.json"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "brick_dnn_site.settings"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]
