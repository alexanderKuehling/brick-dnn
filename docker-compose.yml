# One-command setup:   docker compose up -d   ->   http://localhost:8080

# Docker keeps at most 3 × 10 MB of logs per container, so that the access logs (with
# shortened IP addresses, see frontend/nginx.conf) do not pile up. See docs/privacy.md.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Automatic deletion of old data (docs/privacy.md); unset or 0 keeps everything. The backend
# shows the periods to users, the cleanup service deletes.
x-retention: &retention
  BRICKDNN_DELETE_UNUSED_UPLOADS_DAYS: ${BRICKDNN_DELETE_UNUSED_UPLOADS_DAYS:-}
  BRICKDNN_DELETE_INACTIVE_ACCOUNTS_DAYS: ${BRICKDNN_DELETE_INACTIVE_ACCOUNTS_DAYS:-}
  # Days the activity log of AI agents is kept (empty: 90; 0: no log).
  BRICKDNN_AGENT_LOG_DAYS: ${BRICKDNN_AGENT_LOG_DAYS:-}

# Plans and budgets per account (docs/training.md); unset: no limits.
x-budgets: &budgets
  BRICKDNN_PLANS: ${BRICKDNN_PLANS:-}
  BRICKDNN_DEFAULT_PLAN: ${BRICKDNN_DEFAULT_PLAN:-}
  BRICKDNN_BUDGET_CPU_MINUTES_PER_MONTH: ${BRICKDNN_BUDGET_CPU_MINUTES_PER_MONTH:-}
  BRICKDNN_BUDGET_CPU_MINUTES_PER_RUN: ${BRICKDNN_BUDGET_CPU_MINUTES_PER_RUN:-}
  BRICKDNN_BUDGET_STORAGE_MB: ${BRICKDNN_BUDGET_STORAGE_MB:-}
  BRICKDNN_STAFF_UNLIMITED: ${BRICKDNN_STAFF_UNLIMITED:-true}
  BRICKDNN_PRICE_PER_CPU_HOUR: ${BRICKDNN_PRICE_PER_CPU_HOUR:-}
  BRICKDNN_PRICE_PER_GB_MONTH: ${BRICKDNN_PRICE_PER_GB_MONTH:-}
  BRICKDNN_PRICE_CURRENCY: ${BRICKDNN_PRICE_CURRENCY:-}

# Trainings (docs/training.md): the backend puts them into a queue in the database and the
# worker service trains them, plans with a higher priority first. BRICKDNN_TRAINING_WORKER=false
# switches the queue off: the backend then trains itself (and the worker service idles).
x-training: &training
  BRICKDNN_TRAINING: ${BRICKDNN_TRAINING:-true}
  BRICKDNN_TRAINING_WORKER: ${BRICKDNN_TRAINING_WORKER:-true}
  # Trainings of one account that may wait in the queue (unset: 3 with plans, else no limit).
  BRICKDNN_QUEUE_MAX_WAITING: ${BRICKDNN_QUEUE_MAX_WAITING:-}
  # Seconds without a heartbeat after which a worker counts as dead, and how often a training
  # is started again after its worker restarted (unset: 60 and 3).
  BRICKDNN_WORKER_TIMEOUT: ${BRICKDNN_WORKER_TIMEOUT:-}
  BRICKDNN_WORKER_MAX_RESTARTS: ${BRICKDNN_WORKER_MAX_RESTARTS:-}
  # Memory (MB) a batch of a segmentation training may need (unset: 900, which fits a
  # training process with about 1.8 GB). The backend checks it, the worker enforces it.
  BRICKDNN_SEGMENTATION_MEMORY_MB: ${BRICKDNN_SEGMENTATION_MEMORY_MB:-}

# Backups (deploy/server/README.md, "Backups"): the cleanup service runs `manage.py backup`
# once a day if BRICKDNN_BACKUP_DIR is set (e.g. /data/backups, in the data volume); the
# backend reports a failed or old backup in /api/health/.
x-backup: &backup
  BRICKDNN_BACKUP_DIR: ${BRICKDNN_BACKUP_DIR:-}
  BRICKDNN_BACKUP_KEEP_DAILY: ${BRICKDNN_BACKUP_KEEP_DAILY:-}
  BRICKDNN_BACKUP_KEEP_WEEKLY: ${BRICKDNN_BACKUP_KEEP_WEEKLY:-}
  BRICKDNN_BACKUP_FILES: ${BRICKDNN_BACKUP_FILES:-}
  BRICKDNN_BACKUP_MAX_FILES_MB: ${BRICKDNN_BACKUP_MAX_FILES_MB:-}
  BRICKDNN_BACKUP_MAX_AGE_HOURS: ${BRICKDNN_BACKUP_MAX_AGE_HOURS:-}

# Paid plans with Paddle (docs/billing.md); all unset: off. The backend sells and manages the
# subscriptions, the cleanup service checks them once a day and bills overage. The API key and
# the webhook secret only come from .env; the others can also be in the settings of the domain.
x-paddle: &paddle
  BRICKDNN_PADDLE_ENV: ${BRICKDNN_PADDLE_ENV:-}
  BRICKDNN_PADDLE_CLIENT_TOKEN: ${BRICKDNN_PADDLE_CLIENT_TOKEN:-}
  BRICKDNN_PADDLE_PRICES: ${BRICKDNN_PADDLE_PRICES:-}
  BRICKDNN_PADDLE_OVERAGE_PRODUCT: ${BRICKDNN_PADDLE_OVERAGE_PRODUCT:-}
  BRICKDNN_PADDLE_API_KEY: ${BRICKDNN_PADDLE_API_KEY:-}
  BRICKDNN_PADDLE_WEBHOOK_SECRET: ${BRICKDNN_PADDLE_WEBHOOK_SECRET:-}
  BRICKDNN_PADDLE_GRACE_DAYS: ${BRICKDNN_PADDLE_GRACE_DAYS:-}

# E-mail (docs/email.md); unset: the app sends none. The backend sends links and notices, the
# cleanup service the warnings before inactive accounts are deleted. The login, the password
# and the operator's address only belong into .env; the others can also be in the settings of
# the domain (deploy/sites/<domain>/settings.env).
x-email: &email
  BRICKDNN_EMAIL_HOST: ${BRICKDNN_EMAIL_HOST:-}
  BRICKDNN_EMAIL_PORT: ${BRICKDNN_EMAIL_PORT:-}
  BRICKDNN_EMAIL_USER: ${BRICKDNN_EMAIL_USER:-}
  BRICKDNN_EMAIL_PASSWORD: ${BRICKDNN_EMAIL_PASSWORD:-}
  BRICKDNN_EMAIL_USE_TLS: ${BRICKDNN_EMAIL_USE_TLS:-}
  BRICKDNN_EMAIL_USE_SSL: ${BRICKDNN_EMAIL_USE_SSL:-}
  BRICKDNN_EMAIL_FROM: ${BRICKDNN_EMAIL_FROM:-}
  BRICKDNN_EMAIL_REPLY_TO: ${BRICKDNN_EMAIL_REPLY_TO:-}
  # Server errors (HTTP 500) go to this address, at most one e-mail per kind of error an hour.
  BRICKDNN_ADMIN_EMAIL: ${BRICKDNN_ADMIN_EMAIL:-}
  # Days before the deletion of an inactive account its owner is warned (empty: 14,3).
  BRICKDNN_INACTIVE_ACCOUNT_WARNING_DAYS: ${BRICKDNN_INACTIVE_ACCOUNT_WARNING_DAYS:-}
  # The public address for links in e-mails, e.g. https://brickdnn.com (empty: from each
  # request; the cleanup service has none).
  BRICKDNN_PUBLIC_URL: ${BRICKDNN_PUBLIC_URL:-}

# Error monitoring with Sentry (docs/monitoring.md); no DSN: off. The backend, the worker, the
# realtime server and the cleanup service report their errors to the server project; the
# frontend gets its own DSN when its image is built (below). The release is the deployed
# commit, written to .env by every deploy.
x-sentry: &sentry
  BRICKDNN_SENTRY_DSN: ${BRICKDNN_SENTRY_DSN:-}
  BRICKDNN_SENTRY_ENVIRONMENT: ${BRICKDNN_SENTRY_ENVIRONMENT:-}
  BRICKDNN_SENTRY_RELEASE: ${BRICKDNN_SENTRY_RELEASE:-}
  BRICKDNN_SENTRY_TRACES_SAMPLE_RATE: ${BRICKDNN_SENTRY_TRACES_SAMPLE_RATE:-}

services:
  backend:
    build:
      context: ./backend
      args:
        # Set to "true" to install PyTorch (CPU) and enable training in the UI.
        INSTALL_TORCH: ${BRICKDNN_INSTALL_TORCH:-false}
    # The worker, realtime and cleanup services run the same image.
    image: brick-dnn-backend:local
    # A minimal init process reaps the processes of predictions (and of trainings, without the
    # worker) whose gunicorn worker was restarted.
    init: true
    environment:
      <<: [*retention, *budgets, *paddle, *training, *email, *backup, *sentry]
      # Staff accounts need two-factor authentication for the Django admin (docs/email.md).
      BRICKDNN_REQUIRE_2FA_FOR_STAFF: ${BRICKDNN_REQUIRE_2FA_FOR_STAFF:-}
      # Leave DJANGO_SECRET_KEY empty to generate one on first start (stored in the volume).
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      BRICKDNN_ALLOW_REGISTRATION: ${BRICKDNN_ALLOW_REGISTRATION:-true}
      # Without the queue: trainings the backend runs at the same time.
      BRICKDNN_TRAINING_MAX_RUNS: ${BRICKDNN_TRAINING_MAX_RUNS:-1}
      BRICKDNN_MAX_UPLOAD_MB: ${BRICKDNN_MAX_UPLOAD_MB:-500}
      # Data tab: largest import (MB) and imports from links (see docs/data-preparation.md).
      BRICKDNN_DATA_MAX_UPLOAD_MB: ${BRICKDNN_DATA_MAX_UPLOAD_MB:-200}
      BRICKDNN_DATA_URL_IMPORT: ${BRICKDNN_DATA_URL_IMPORT:-true}
      BRICKDNN_DATA_URL_ALLOW_PRIVATE: ${BRICKDNN_DATA_URL_ALLOW_PRIVATE:-false}
      # Imprint, privacy policy, terms of use: imprint.md, privacy.md, terms.md in this folder
      # of the data volume (docs/privacy.md); deploy/server/compose.yml mounts one of the server.
      BRICKDNN_LEGAL_DIR: /data/legal
      # Empty: SQLite in the volume. postgresql://… (e.g. Supabase): see docs/database.md.
      DATABASE_URL: ${DATABASE_URL:-}
      # nginx in the frontend container is the one proxy in front of Django.
      BRICKDNN_NUM_PROXIES: 1
      # Live editing: the backend tells the realtime service about saves through Redis.
      REDIS_URL: redis://redis:6379/0
      # /api/health/ (docs/api.md): "degraded" below this much free space (MB) in /data, and the
      # secret of the X-Health-Token header that shows the details of the checks.
      BRICKDNN_HEALTH_MIN_FREE_MB: ${BRICKDNN_HEALTH_MIN_FREE_MB:-}
      BRICKDNN_HEALTH_TOKEN: ${BRICKDNN_HEALTH_TOKEN:-}
    volumes:
      - brickdnn-data:/data
    depends_on:
      - redis
    logging: *logging
    restart: unless-stopped

  # Trains what the backend queued (docs/training.md): `manage.py training_worker`, the same
  # image, the same data volume (run directories, datasets; SQLite without DATABASE_URL). It
  # waits until the backend has migrated the database.
  worker:
    image: brick-dnn-backend:local
    pull_policy: never
    command: ["python", "manage.py", "training_worker"]
    # Passes the stop signal on to the worker and reaps the training processes.
    init: true
    # When it is stopped (e.g. by a deploy), the worker lets its trainings finish for 30
    # seconds (BRICKDNN_WORKER_DRAIN_SECONDS; keep it well below the grace period), then puts
    # them back into the queue: the next worker starts them again.
    stop_grace_period: 60s
    environment:
      <<: [*budgets, *training, *sentry]
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-}
      BRICKDNN_WORKER_DRAIN_SECONDS: ${BRICKDNN_WORKER_DRAIN_SECONDS:-}
      # Trainings at the same time. Unset: BRICKDNN_TRAINING_MAX_RUNS if that is set, else as
      # many as fit on the CPUs with OMP_NUM_THREADS threads each (one without it).
      BRICKDNN_WORKER_SLOTS: ${BRICKDNN_WORKER_SLOTS:-${BRICKDNN_TRAINING_MAX_RUNS:-}}
    volumes:
      - brickdnn-data:/data
    depends_on:
      - backend
    healthcheck:
      # The worker touches this file in every round (every two seconds).
      test:
        - CMD
        - python
        - -c
        - "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/brickdnn-worker.alive') > 60)"
      interval: 30s
      timeout: 5s
      start_period: 60s
    logging: *logging
    restart: unless-stopped

  # Live editing (WebSockets under /api/ws/): the same image, served by Daphne.
  realtime:
    image: brick-dnn-backend:local
    pull_policy: never
    command: ["daphne", "--bind", "0.0.0.0", "--port", "8001", "brick_dnn_site.asgi:application"]
    environment:
      <<: *sentry
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DATABASE_URL: ${DATABASE_URL:-}
      REDIS_URL: redis://redis:6379/0
    volumes:
      # The data volume holds the SQLite database and the generated secret key.
      - brickdnn-data:/data
    depends_on:
      - backend
      - redis
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8001), 2)"]
      interval: 30s
      timeout: 5s
    logging: *logging
    restart: unless-stopped

  # Once a day: deletes old data if BRICKDNN_DELETE_* is set (with e-mail, after warning the
  # owners of inactive accounts), and expired logins; with paid plans (docs/billing.md) it also
  # checks the subscriptions and bills overage, and with BRICKDNN_BACKUP_DIR it makes a backup
  # (manage.py backup) after both. The same
  # image; it sleeps most of the time. The first run is ten minutes after a start (the backend
  # migrates the database first). `docker compose logs cleanup` shows what it did.
  cleanup:
    image: brick-dnn-backend:local
    pull_policy: never
    # Passes the stop signal on to the shell loop, so that the container stops at once.
    init: true
    command:
      - sh
      - -c
      - "sleep 600; while true; do python manage.py purge_old_data; python manage.py billing_sync; python manage.py backup; sleep 86400; done"
    environment:
      <<: [*retention, *budgets, *paddle, *email, *backup, *sentry]
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-}
    volumes:
      - brickdnn-data:/data
    depends_on:
      - backend
    healthcheck:
      disable: true
    logging: *logging
    restart: unless-stopped

  # Passes live-editing messages between the server processes; keeps nothing on disk.
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "48mb"]
    logging: *logging
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Error monitoring in the browser (docs/monitoring.md); empty: off. Built into the app.
        VITE_SENTRY_DSN: ${BRICKDNN_SENTRY_FRONTEND_DSN:-}
        VITE_SENTRY_ENVIRONMENT: ${BRICKDNN_SENTRY_ENVIRONMENT:-}
        VITE_SENTRY_RELEASE: ${BRICKDNN_SENTRY_RELEASE:-}
        VITE_SENTRY_TRACES_SAMPLE_RATE: ${BRICKDNN_SENTRY_TRACES_SAMPLE_RATE:-}
    ports:
      - "${BRICKDNN_PORT:-8080}:80"
    depends_on:
      - backend
      - realtime
    logging: *logging
    restart: unless-stopped

volumes:
  brickdnn-data:
