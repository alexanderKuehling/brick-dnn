name: CI

on:
  push:
    branches: [main]
  pull_request:
  # "Run workflow" in the Actions tab: on main, this also deploys the online demo.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies (incl. CPU-only PyTorch to execute and train generated models)
        run: |
          pip install -r requirements-dev.txt
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: pytest

  postgres:
    name: Backend on PostgreSQL (Supabase setup)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/brickdnn
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies (incl. CPU-only PyTorch)
        run: |
          pip install -r requirements-dev.txt
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Add Supabase's API roles, so the tests check that they are locked out
        run: |
          python -c "import psycopg; c = psycopg.connect('postgresql://postgres:postgres@localhost:5432/postgres', autocommit=True); c.execute('CREATE ROLE anon NOLOGIN'); c.execute('CREATE ROLE authenticated NOLOGIN')"
      - name: Tests
        run: pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck, format, lint, unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Online demo build (code generator in the browser)
        run: npm run build:demo

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: [backend, postgres, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Build and start
        run: docker compose up -d --build
      - name: Wait for the API
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/api/health/ && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Smoke test
        run: |
          curl -sf http://localhost:8080/ | grep -q "Brick DNN"
          curl -sf http://localhost:8080/api/layers/ | grep -q TransformerEncoder
          curl -sf -X POST http://localhost:8080/api/generate/ \
            -H "Content-Type: application/json" \
            -d '{"graph":{"nodes":[{"id":"i","type":"Input","params":{"shape":[4]}},{"id":"l","type":"Linear","params":{"out_features":2}}],"edges":[{"source":"i","target":"l"}]}}' \
            | grep -q "nn.Linear(4, 2)"
          # The default image has no PyTorch: training is reported as unavailable.
          curl -sf http://localhost:8080/api/training/ | grep -q '"available":false'
          # Data preparation only needs pandas, which is always installed.
          curl -sf http://localhost:8080/api/data/ | grep -q '"available":true'
          curl -sf http://localhost:8080/api/data/steps/ | grep -q '"impute"'
      - name: Shut down
        if: always()
        run: docker compose down -v

  deploy-server:
    name: Deploy to the server (backend + frontend)
    # Only from main, never for pull requests, after every check passed, and only once the
    # server is set up (repository variable DEPLOY_HOST, see deploy/server/README.md).
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_HOST != ''
    needs: [backend, postgres, frontend, docker]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-server
      cancel-in-progress: false
    steps:
      - name: Deploy this commit
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key may only run deploy.sh on the server, which deploys this commit of main.
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            "deploy@$HOST" "$GITHUB_SHA"
      - name: Check that the site answers
        env:
          URL: ${{ vars.DEPLOY_URL }}
        run: |
          for i in $(seq 1 30); do
            curl -sf "$URL/api/health/" && curl -sf "$URL/" | grep -q "Brick DNN" && exit 0
            sleep 5
          done
          echo "$URL does not answer after the deploy." >&2
          exit 1

  deploy-demo:
    name: Deploy online demo (Hugging Face)
    # Only from main, never for pull requests, and only after every check passed.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [backend, postgres, frontend, docker]
    runs-on: ubuntu-latest
    # Deploys run one after the other, the newest last.
    concurrency:
      group: deploy-demo
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          npm ci --prefix frontend
          pip install "huggingface_hub>=0.34"
      - name: Build and upload
        env:
          # A Hugging Face token with write access to the Space (repository secret).
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_PYTHON: python
          # Another Space: set the repository variable HF_SPACE (e.g. user/space).
          SPACE: ${{ vars.HF_SPACE || 'alexKlg/brick-dnn' }}
        run: deploy/huggingface/deploy.sh "$SPACE"
