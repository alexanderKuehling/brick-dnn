name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies (incl. CPU-only PyTorch to execute and train generated models)
        run: |
          pip install -r requirements-dev.txt
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: pytest

  postgres:
    name: Backend on PostgreSQL (Supabase setup)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/brickdnn
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies (incl. CPU-only PyTorch)
        run: |
          pip install -r requirements-dev.txt
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Add Supabase's API roles, so the tests check that they are locked out
        run: |
          python -c "import psycopg; c = psycopg.connect('postgresql://postgres:postgres@localhost:5432/postgres', autocommit=True); c.execute('CREATE ROLE anon NOLOGIN'); c.execute('CREATE ROLE authenticated NOLOGIN')"
      - name: pg_dump 17, so the tests of native backups and of move_database run too
        run: |
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - name: Tests
        run: pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck, format, lint, unit tests
        run: npm test
      - name: Production build
        run: npm run build

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: [backend, postgres, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Server configuration is valid
        # With the values deploy/server/deploy.sh writes to .env on a server with 1 vCPU and 2 GB.
        env:
          BRICKDNN_DOMAIN: example.com
          BRICKDNN_BACKEND_CPUS: "0.75"
          BRICKDNN_BACKEND_MEMORY: 1459m
          BRICKDNN_BACKEND_THREADS: "1"
        run: |
          docker compose -f docker-compose.yml -f deploy/server/compose.yml config --quiet
          # With the PostgreSQL service (deploy/server/README.md, "The PostgreSQL service").
          COMPOSE_PROFILES=postgres docker compose -f docker-compose.yml -f deploy/server/compose.yml config --quiet
      - name: Build and start
        run: docker compose up -d --build
      - name: Wait for the API
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/api/health/ && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Smoke test
        run: |
          curl -sf http://localhost:8080/ | grep -q "Brick DNN"
          curl -sf http://localhost:8080/api/layers/ | grep -q TransformerEncoder
          curl -sf -X POST http://localhost:8080/api/generate/ \
            -H "Content-Type: application/json" \
            -d '{"graph":{"nodes":[{"id":"i","type":"Input","params":{"shape":[4]}},{"id":"l","type":"Linear","params":{"out_features":2}}],"edges":[{"source":"i","target":"l"}]}}' \
            | grep -q "nn.Linear(4, 2)"
          # The default image has no PyTorch: training is reported as unavailable.
          curl -sf http://localhost:8080/api/training/ | grep -q '"available":false'
          # Data preparation only needs pandas, which is always installed.
          curl -sf http://localhost:8080/api/data/ | grep -q '"available":true'
          curl -sf http://localhost:8080/api/data/steps/ | grep -q '"impute"'
      - name: Switch to the PostgreSQL service
        env:
          COMPOSE_PROFILES: postgres
          BRICKDNN_POSTGRES_PASSWORD: ci-only-password
          DATABASE_URL: postgresql://brickdnn:ci-only-password@db:5432/brickdnn
        run: |
          docker compose up -d --wait db
          docker compose up -d
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/api/health/ && break
            sleep 2
          done
          curl -sf http://localhost:8080/api/layers/ | grep -q TransformerEncoder
          # The backend migrated the db service's database, with pg_dump of the server's version.
          docker compose exec -T db psql -U postgres -d brickdnn -tAc "SELECT count(*) FROM django_migrations" | grep -qv '^0$'
          docker compose exec -T backend pg_dump --version | grep -q ' 17\.'
      - name: Backups and move_database on the PostgreSQL service
        env:
          COMPOSE_PROFILES: postgres
          BRICKDNN_POSTGRES_PASSWORD: ci-only-password
          DATABASE_URL: postgresql://brickdnn:ci-only-password@db:5432/brickdnn
          COPY_URL: postgresql://brickdnn:ci-only-password@db:5432/brickdnn_copy
        run: |
          docker compose exec -T cleanup python manage.py backup --dir /data/ci-backups --files none --database-format native
          docker compose exec -T cleanup python manage.py backup --dir /data/ci-backups --hourly --keep-hourly 24 --database-format native
          docker compose exec -T cleanup python manage.py restore latest --dir /data/ci-backups --database-only --no-input
          docker compose exec -T db createdb -U postgres -O brickdnn brickdnn_copy
          docker compose exec -T -e COPY_URL backend python manage.py move_database --to env:COPY_URL --dry-run | tee move.txt
          grep -q "RESULT: PASS" move.txt
          curl -sf http://localhost:8080/api/health/
      - name: Shut down
        if: always()
        run: docker compose --profile postgres down -v

