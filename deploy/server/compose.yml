# Additions for a public server: Caddy in front of the app, with HTTPS from Let's Encrypt.
#   docker compose -f docker-compose.yml -f deploy/server/compose.yml up -d --build
# Settings come from .env next to docker-compose.yml (written by setup.sh), see README.md.
# Every deploy writes the limits of the containers there (deploy.sh): BRICKDNN_BACKEND_* (three
# quarters of the server, which the worker's CPUs and threads default to) and, with the
# deploy.sh of this version, BRICKDNN_WEB_* and BRICKDNN_WORKER_*. Without the latter the fixed
# defaults below apply, which fit a server with 2 CPUs and 4 GB.

# At most 3 × 10 MB of logs per container (Caddy's own; the others are in docker-compose.yml).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    environment:
      # Caddy and nginx are in front of Django (for the client address in rate limits).
      BRICKDNN_NUM_PROXIES: 2
      DJANGO_SECURE_COOKIES: "true"
      # NumPy (data preparation) and PyTorch (predictions): not one thread per CPU of the
      # server. The same number as the worker's, so both count unreported CPU time alike.
      OMP_NUM_THREADS: ${BRICKDNN_WORKER_THREADS:-${BRICKDNN_BACKEND_THREADS:?see deploy/server/README.md}}
      # Imprint, privacy policy and terms of use (deploy/legal/): Markdown files in
      # /srv/brick-dnn/legal on the server (setup.sh creates the folder), else the ones of this
      # domain in the repository, deploy/sites/<BRICKDNN_DOMAIN>/legal/ (deployed with the code).
      BRICKDNN_LEGAL_DIR: /legal:/sites/${BRICKDNN_DOMAIN:-none}/legal
      # Settings of this domain kept in the repository (deploy/sites/README.md); .env wins.
      BRICKDNN_SITE_ENV: /sites/${BRICKDNN_DOMAIN:-none}/settings.env
    volumes:
      - /srv/brick-dnn/legal:/legal:ro
      - ./deploy/sites:/sites:ro
    # Django trains nothing itself any more (the worker does): it serves the API, prepares
    # data and runs predictions (a short process each, with PyTorch). A CPU and a gigabyte of
    # its own, and more CPU time than the worker when both want it: the site answers while
    # trainings run. No swap: what needs more memory is stopped instead of slowing everything
    # down.
    cpus: ${BRICKDNN_WEB_CPUS:-1.0}
    cpu_shares: 2048
    mem_limit: ${BRICKDNN_WEB_MEMORY:-1024m}
    memswap_limit: ${BRICKDNN_WEB_MEMORY:-1024m}

  # The trainings: at most three quarters of the CPUs (as the backend had when it trained
  # itself) and a fixed share of the memory, so they cannot take what the site needs. It gets
  # the CPU last when the server is busy, and a training that needs more memory than the
  # worker has is stopped by the kernel (the run fails; the worker goes on).
  worker:
    environment:
      # PyTorch and NumPy: one thread per whole CPU of the worker.
      OMP_NUM_THREADS: ${BRICKDNN_WORKER_THREADS:-${BRICKDNN_BACKEND_THREADS:?see deploy/server/README.md}}
      # The plans of this domain (deploy/sites/README.md): the worker checks budgets too.
      BRICKDNN_SITE_ENV: /sites/${BRICKDNN_DOMAIN:-none}/settings.env
    volumes:
      - ./deploy/sites:/sites:ro
    cpus: ${BRICKDNN_WORKER_CPUS:-${BRICKDNN_BACKEND_CPUS:?see deploy/server/README.md}}
    cpu_shares: 512
    mem_limit: ${BRICKDNN_WORKER_MEMORY:-1792m}
    memswap_limit: ${BRICKDNN_WORKER_MEMORY:-1792m}

  # Live editing only passes small messages on: little CPU and memory.
  realtime:
    environment:
      BRICKDNN_NUM_PROXIES: 2
    cpus: "0.5"
    mem_limit: 256m
    memswap_limit: 256m

  redis:
    mem_limit: 64m
    memswap_limit: 64m

  # Deletes old data once a day (docs/privacy.md); sleeps in between.
  cleanup:
    environment:
      BRICKDNN_SITE_ENV: /sites/${BRICKDNN_DOMAIN:-none}/settings.env
    volumes:
      - ./deploy/sites:/sites:ro
    cpus: "0.5"
    mem_limit: 256m
    memswap_limit: 256m

  frontend:
    # Only Caddy talks to nginx: nothing is published on port 8080.
    ports: !reset []
    # The site comes first: more CPU time than the rest of the server when the CPUs are busy
    # (e.g. while images are built), and the last to be killed when memory runs out.
    cpu_shares: 4096
    oom_score_adj: -500

  caddy:
    image: caddy:2.10-alpine
    environment:
      BRICKDNN_DOMAIN: ${BRICKDNN_DOMAIN:?Set BRICKDNN_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/server/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
    # Like the frontend: the site comes first.
    cpu_shares: 4096
    oom_score_adj: -500
    # Caddy writes no access log; its error log can name client addresses.
    logging: *logging
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
